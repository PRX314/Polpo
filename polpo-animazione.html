<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polpo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100vh;
    background: #050510;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  svg { width: min(580px, 90vmin); height: min(580px, 90vmin); }
</style>
</head>

<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- Sfondo con calore al centro -->
  <radialGradient id="bgGrad" cx="50%" cy="46%" r="52%">
    <stop offset="0%"   stop-color="#0e0828"/>
    <stop offset="100%" stop-color="#050510"/>
  </radialGradient>

  <!-- Corpo: gradiente radiale a 5 stop, luce in alto a sinistra -->
  <radialGradient id="bodyGrad" cx="40%" cy="30%" r="70%">
    <stop offset="0%"   stop-color="#f4e2ff"/>
    <stop offset="15%"  stop-color="#cb68ff"/>
    <stop offset="42%"  stop-color="#7c22c4"/>
    <stop offset="72%"  stop-color="#3d0a8e"/>
    <stop offset="100%" stop-color="#180440"/>
  </radialGradient>

  <!-- Rim light bioluminescente dal basso -->
  <radialGradient id="rimGrad" cx="50%" cy="96%" r="55%">
    <stop offset="0%"   stop-color="#9050ff" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#9050ff" stop-opacity="0"/>
  </radialGradient>

  <!-- Iride occhi -->
  <radialGradient id="irisGrad" cx="36%" cy="33%" r="64%">
    <stop offset="0%"   stop-color="#eddeff"/>
    <stop offset="45%"  stop-color="#8a2ee0"/>
    <stop offset="100%" stop-color="#2e0870"/>
  </radialGradient>

  <!-- Alone ambient attorno al polpo (halo molto morbido) -->
  <filter id="halo" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>

  <!-- Glow corpo (morbido, dà profondità) -->
  <filter id="bodyGlow" x="-28%" y="-28%" width="156%" height="156%">
    <feGaussianBlur stdDeviation="11" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Glow tentacoli (leggero) -->
  <filter id="tentGlow" x="-18%" y="-10%" width="136%" height="120%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Micro-glow sucker -->
  <filter id="suckGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const OX      = '300 258';
  const tentIds = ['#t1','#t2','#t3','#t4','#t5','#t6','#t7','#t8'];

  gsap.set(tentIds,   { svgOrigin: OX });
  gsap.set('#octopus',{ svgOrigin: OX });

  const tl = gsap.timeline({ repeat: -1 });

  // ── Fase 0: respiro idle ──
  tl.to('#body', { scaleX: 1.04, scaleY: 0.97, duration: 0.80, ease: 'sine.inOut', svgOrigin: '300 258' })
    .to('#body', { scaleX: 1,    scaleY: 1,    duration: 0.80, ease: 'sine.inOut', svgOrigin: '300 258' });

  // ── Fase 1: APERTURA ──
  tl.to('#t1', { rotation: -24, duration: 1.1, ease: 'power2.inOut' }, '+=0.15')
    .to('#t2', { rotation: -17, duration: 1.1, ease: 'power2.inOut' }, '<0.04')
    .to('#t3', { rotation:  -9, duration: 1.1, ease: 'power2.inOut' }, '<0.04')
    .to('#t4', { rotation:   9, duration: 1.1, ease: 'power2.inOut' }, '<0.04')
    .to('#t5', { rotation:  17, duration: 1.1, ease: 'power2.inOut' }, '<0.04')
    .to('#t6', { rotation:  24, duration: 1.1, ease: 'power2.inOut' }, '<0.04')
    .to('#t7', { rotation:  22, duration: 1.1, ease: 'power2.inOut' }, '<0.04')
    .to('#t8', { rotation: -22, duration: 1.1, ease: 'power2.inOut' }, '<0.04');

  tl.to({}, { duration: 0.45 });

  // ── Fase 2: CHIUSURA ──
  tl.to('#t1', { rotation:  38, duration: 0.9, ease: 'power2.inOut' }, '+=0')
    .to('#t2', { rotation:  28, duration: 0.9, ease: 'power2.inOut' }, '<0.04')
    .to('#t3', { rotation:  15, duration: 0.9, ease: 'power2.inOut' }, '<0.04')
    .to('#t4', { rotation: -15, duration: 0.9, ease: 'power2.inOut' }, '<0.04')
    .to('#t5', { rotation: -28, duration: 0.9, ease: 'power2.inOut' }, '<0.04')
    .to('#t6', { rotation: -38, duration: 0.9, ease: 'power2.inOut' }, '<0.04')
    .to('#t7', { rotation: -32, duration: 0.9, ease: 'power2.inOut' }, '<0.04')
    .to('#t8', { rotation:  32, duration: 0.9, ease: 'power2.inOut' }, '<0.04');

  // ── Fase 3: ALLONTANAMENTO ──
  tl.to('#octopus', {
    scale: 0.04, y: -55, opacity: 0,
    duration: 1.75, ease: 'power3.in'
  }, '+=0.25');

  // Reset e pausa prima del loop
  tl.set('#octopus', { scale: 1, y: 0, opacity: 1 });
  tl.set(tentIds,    { rotation: 0 });
  tl.to({}, { duration: 0.4 });
</script>

<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Polpo" />
    <title>Polpo</title>
    <script>
      // Applica il tema prima del primo disegno, così non c'è il lampo bianco all'avvio
      (function () {
        try {
          var t = localStorage.getItem('gestionale-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <style>
      html[data-theme="dark"] body { background: #0a0a0a; color: #f5f5f5; }
      body { font-family: system-ui, sans-serif; margin: 0; }
      #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 14px; opacity: .6; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Caricamento…</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

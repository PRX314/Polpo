[build]
  base = "gestionale-x"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No cache for SW and HTML
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
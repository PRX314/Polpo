<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X World Project - Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f5576c;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #f7fafc;
            --gray: #718096;
            --success: #48bb78;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            min-height: 100vh;
            color: white;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 15px;
            padding: 15px 10px 10px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 0.8rem;
            color: #a8dadc;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        /* ===== NAVIGATION GRID ===== */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .nav-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .nav-card:hover::before {
            opacity: 0.15;
        }

        .nav-card:active {
            transform: scale(0.98);
            border-color: var(--primary);
        }

        .nav-card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .nav-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: white;
        }

        .nav-description {
            font-size: 0.7rem;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 6px;
            width: fit-content;
        }

        .badge.public {
            background: rgba(72, 187, 120, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge.members {
            background: rgba(245, 87, 108, 0.2);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .badge.education {
            background: rgba(102, 126, 234, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }


        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 12px 10px;
            margin-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-text {
            color: var(--gray);
            font-size: 0.7rem;
        }

        /* ===== CYCLE INDICATOR ===== */
        .cycle-indicator {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cycle-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .cycle-info {
            flex: 1;
            min-width: 0;
        }

        .cycle-title {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .cycle-progress {
            background: rgba(255, 255, 255, 0.1);
            height: 3px;
            border-radius: 2px;
            overflow: hidden;
        }

        .cycle-progress-bar {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            height: 100%;
            width: 33%;
            border-radius: 2px;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 769px) {
            body {
                padding: 30px;
            }

            .header {
                padding: 40px 20px;
                margin-bottom: 50px;
            }

            .logo {
                font-size: 3.5rem;
            }

            .tagline {
                font-size: 1.2rem;
            }

            .description {
                font-size: 1rem;
            }

            .nav-grid {
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 25px;
                margin-bottom: 50px;
            }

            .nav-card {
                padding: 30px 25px;
            }

            .nav-icon {
                font-size: 3rem;
                margin-bottom: 15px;
            }

            .nav-title {
                font-size: 1.5rem;
                margin-bottom: 8px;
            }

            .nav-subtitle {
                font-size: 0.9rem;
                margin-bottom: 12px;
            }

            .nav-description {
                font-size: 0.9rem;
                -webkit-line-clamp: 3;
                margin-bottom: 15px;
            }

            .section-header {
                margin-bottom: 25px;
                padding-bottom: 12px;
            }

            .section-icon {
                font-size: 1.8rem;
            }

            .section-title {
                font-size: 1.8rem;
            }

            .section-subtitle {
                display: block;
                font-size: 0.9rem;
            }

            .section {
                margin-bottom: 50px;
            }

            .cycle-indicator {
                padding: 20px 25px;
                margin-bottom: 40px;
            }

            .cycle-icon {
                font-size: 2rem;
            }

            .cycle-title {
                font-size: 1.1rem;
            }

            .cycle-phase {
                font-size: 0.85rem;
            }

            .footer {
                padding: 30px 20px;
                margin-top: 60px;
            }

            .footer-link {
                font-size: 0.85rem;
            }

            .footer-text {
                font-size: 0.8rem;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-card {
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .nav-card:nth-child(1) { animation-delay: 0.1s; }
        .nav-card:nth-child(2) { animation-delay: 0.2s; }
        .nav-card:nth-child(3) { animation-delay: 0.3s; }
        .nav-card:nth-child(4) { animation-delay: 0.4s; }
        .nav-card:nth-child(5) { animation-delay: 0.5s; }
        .nav-card:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1 class="logo">X WORLD</h1>
            <p class="tagline">Web3 Creative Ecosystem</p>
        </div>

        <!-- ===== CURRENT CYCLE ===== -->
        <div class="cycle-indicator">
            <div class="cycle-icon">🔄</div>
            <div class="cycle-info">
                <div class="cycle-title">Cycle Nov • Creation 1/3</div>
                <div class="cycle-progress">
                    <div class="cycle-progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- ===== NAVIGATION ===== -->
        <div class="nav-grid">
            <a href="x-project-app.html" class="nav-card">
                <div class="nav-card-content">
                    <span class="nav-icon">📱</span>
                    <h3 class="nav-title">X Project App</h3>
                    <p class="nav-description">App membri NFT</p>
                    <span class="badge members">🔒 NFT</span>
                </div>
            </a>

            <a href="estetica.html" class="nav-card">
                <div class="nav-card-content">
                    <span class="nav-icon">✨</span>
                    <h3 class="nav-title">Estetica</h3>
                    <p class="nav-description">Showcase visivo</p>
                    <span class="badge public">🌍 Public</span>
                </div>
            </a>

            <a href="testo.html" class="nav-card">
                <div class="nav-card-content">
                    <span class="nav-icon">📄</span>
                    <h3 class="nav-title">Docs</h3>
                    <p class="nav-description">Whitepaper</p>
                    <span class="badge public">🌍 Public</span>
                </div>
            </a>

            <a href="crypto-academy.html" class="nav-card">
                <div class="nav-card-content">
                    <span class="nav-icon">🎓</span>
                    <h3 class="nav-title">Crypto Learn</h3>
                    <p class="nav-description">Blockchain education</p>
                    <span class="badge education">📚 Learn</span>
                </div>
            </a>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <p class="footer-text">X World Project © 2025</p>
        </div>
    </div>

    <script>
        // ===== SMOOTH SCROLL =====
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // ===== CYCLE PROGRESS ANIMATION =====
        function updateCycleProgress() {
            const progressBar = document.querySelector('.cycle-progress-bar');
            if (progressBar) {
                // Simulate progress based on current week
                const currentWeek = 1; // This would be dynamic in production
                const progress = (currentWeek / 3) * 100;
                progressBar.style.width = progress + '%';
            }
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            updateCycleProgress();

            // Log navigation
            document.querySelectorAll('.nav-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const title = card.querySelector('.nav-title').textContent;
                    console.log(`Navigating to: ${title}`);
                });
            });
        });

        // ===== EASTER EGG - Click logo 5 times =====
        let logoClicks = 0;
        document.querySelector('.logo').addEventListener('click', () => {
            logoClicks++;
            if (logoClicks === 5) {
                document.body.style.animation = 'rainbow 5s linear infinite';
                setTimeout(() => {
                    document.body.style.animation = '';
                    logoClicks = 0;
                }, 5000);
            }
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes rainbow {
                0% { filter: hue-rotate(0deg); }
                100% { filter: hue-rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
